<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Рыбалка - Русский язык</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --hud-h: 86px;

      --pit-x: 92%;
      --pit-y: 88%;
      --pit-w: 1240px;
      --pit-h: 720px;
      --pit-tilt: 14deg;

      --hero-x: 31%;
      --hero-y: 75%;
      --hero-w: 360px;

      /* Ваши идеальные настройки удочки */
      --wand-w: 320px; 
      --wand-x: calc(var(--hero-x) + 50px);
      --wand-y: calc(var(--hero-y) - 10px);
      --wand-rot: 0deg;

      --ui: rgba(28, 43, 28, 0.75); 
      --ui-border: rgba(168, 204, 153, 0.2); 
      --text: rgba(255,255,255,.95);
      --muted: rgba(200, 220, 200,.80);
      --shadow: 0 12px 40px rgba(0,0,0,.45);
      --glass: blur(12px);
      --ease: cubic-bezier(.2,.8,.2,1);

      --good: #7ef25e;
      --bad: #ff6b6b;
      --gold: #f1c40f;
      --goldGlow: rgba(241, 196, 15, 0.6);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: "Roboto Condensed", "Roboto", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, "Noto Sans", "Liberation Sans", sans-serif;
      background:#0b0f17;
      color:var(--text);
      overflow:hidden;
      touch-action: manipulation;
    }

    .app{height:100%; display:flex; flex-direction:column;}

    .hud{
      height:var(--hud-h);
      display:flex;
      align-items:center;
      justify-content:flex-end;
      padding:14px 18px;
      gap:14px;
      position:relative;
      z-index:50;
      background: rgba(35, 48, 35, 0.65);
      backdrop-filter: blur(8px);
      pointer-events:none;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .hud > *{ pointer-events:auto; }
    .rightHud{ display:flex; align-items:center; gap:10px; }

    .pill{
      display:flex; align-items:center; gap:10px;
      padding:10px 12px;
      background:var(--ui);
      border:1px solid var(--ui-border);
      backdrop-filter: var(--glass);
      border-radius:999px;
      box-shadow: var(--shadow);
      min-height:44px;
    }
    .pill .label{color:var(--muted); font-size:13px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px;}

    .hearts{ display:flex; gap:6px; align-items:center; margin-top: 2px;}
    .heart{
      width:12px; height:12px;
      border-radius:50%;
      background:rgba(255,255,255,.22);
      box-shadow: 0 0 0 2px rgba(255,255,255,.10) inset;
    }
    .heart.on{
      background: var(--bad);
      box-shadow: 0 0 18px rgba(255,107,107,.65);
    }

    .collection{
      display:flex; align-items:center; gap:10px;
      padding:10px 12px;
      background:var(--ui);
      border:1px solid var(--ui-border);
      backdrop-filter: var(--glass);
      border-radius:24px;
      box-shadow: var(--shadow);
      max-width: 45vw;
    }
    .collection .title{
      font-size:13px;
      font-weight: bold;
      color:var(--muted);
      margin-right:2px;
      white-space:nowrap;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .slots{display:flex; gap:6px; align-items:center; flex-wrap: wrap; justify-content: flex-end;}
    .slot{
      width:30px; height:30px;
      border-radius:10px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      display:grid;
      place-items:center;
      overflow:hidden;
      position:relative;
    }
    .slot.filled{
      background:rgba(126, 242, 94,.15);
      border-color: rgba(126, 242, 94,.4);
    }
    .slot img{
      width:92%; height:92%;
      object-fit:contain;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,.45));
    }

    .score{
      display:flex; align-items:center; gap:10px;
      padding:10px 16px;
      background:var(--ui);
      border:1px solid var(--ui-border);
      backdrop-filter: var(--glass);
      border-radius:999px;
      box-shadow: var(--shadow);
      min-height:44px;
      white-space:nowrap;
    }
    .score .label{ color:var(--muted); font-size:13px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
    .score strong{ font-size:18px; letter-spacing:.2px; color: var(--gold); }

    .scene{ position:relative; flex:1; overflow:hidden; user-select:none; cursor: default; }
    .bg{
      position:absolute; inset:0;
      background:
      radial-gradient(1000px 520px at 62% 70%, rgba(0,0,0,.0), rgba(0,0,0,.38)),
        url("images/bg.png");
      background-size: cover;
      background-position: center;
      filter:saturate(1.08) contrast(1.02);
      transform: scale(1.02);
    }

    .pitWrap{
      position:absolute;
      left: var(--pit-x);
      top: var(--pit-y);
      width: var(--pit-w);
      height: var(--pit-h);
      transform: translate(-50%, -50%) perspective(900px) rotateX(56deg) rotateZ(var(--pit-tilt));
      z-index:10;
      pointer-events:none;
    }
    .pit{ position:absolute; inset:0; border-radius: 58% 42% 60% 40% / 55% 45% 58% 42%; background: transparent; }

    .hero{
      position:absolute;
      left: var(--hero-x);
      top: var(--hero-y);
      width: var(--hero-w);
      transform: translate(-50%, -50%);
      z-index:20;
      pointer-events:none;
    }
    .hero img{
      width:100%;
      height:auto;
      object-fit:contain;
      filter: drop-shadow(0 18px 22px rgba(0,0,0,.45));
    }

    .wand{
      position:absolute;
      left: var(--wand-x);
      top: var(--wand-y);
      width: var(--wand-w);
      transform: translate(-50%, -50%) rotate(var(--wand-rot));
      z-index:40;
      pointer-events:auto;
      cursor:pointer;
      filter: drop-shadow(0 14px 18px rgba(0,0,0,.42));
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transform-origin: 22% 78%;
    }
    .wand img{ width:100%; height:auto; object-fit:contain; pointer-events:none; }
    .wand.wiggle{ animation: wiggle 420ms var(--ease) 1; }
    @keyframes wiggle{
      0%{ transform: translate(-50%, -50%) rotate(var(--wand-rot)) rotate(0deg) translateY(0); }
      35%{ transform: translate(-50%, -50%) rotate(var(--wand-rot)) rotate(-6deg) translateY(-2px); }
      70%{ transform: translate(-50%, -50%) rotate(var(--wand-rot)) rotate(5deg) translateY(1px); }
      100%{ transform: translate(-50%, -50%) rotate(var(--wand-rot)) rotate(0deg) translateY(0); }
    }

    .deepItem{
      position:absolute;
      width: 44px;
      opacity: 0.6; /* ПОЛУПРОЗРАЧНЫЕ РЫБЫ В ВОДЕ */
      transform: translate(-50%,-50%) scale(1);
      z-index:16;
      pointer-events:none;
      filter: drop-shadow(0 10px 12px rgba(0,0,0,.25));
      will-change: transform, left, top;
    }
    .deepItem img{ width:100%; height:auto; object-fit:contain; }
    .captured{
      z-index:30;
      opacity:1 !important; /* ЯРКИЕ РЫБЫ НА КРЮЧКЕ */
      filter: drop-shadow(0 18px 18px rgba(0,0,0,.35));
      pointer-events:none;
    }

    svg#lineLayer{ position:absolute; inset:0; z-index:15; pointer-events:none; overflow:visible; }
    .linePath{ fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .lineMain{ stroke: var(--gold); stroke-width: 2.2; filter: drop-shadow(0 0 10px rgba(255, 200, 90, .55)); }
    .lineGlow{ stroke: var(--goldGlow); stroke-width: 9.5; filter: blur(1.05px); }

    .ripple{
      position:absolute; z-index:26; pointer-events:none;
      width:18px; height:18px; border-radius:999px;
      border:2px solid rgba(255, 212, 102, .55);
      box-shadow: 0 0 22px rgba(255, 200, 90, .22);
      opacity:0; transform: translate(-50%,-50%) scale(.2);
      will-change: transform, opacity;
    }
    .ripple.play{ animation: ripple 900ms var(--ease) 1; }
    @keyframes ripple{
      0%{ opacity:0; transform: translate(-50%,-50%) scale(.2); }
      18%{ opacity:.95; }
      100%{ opacity:0; transform: translate(-50%,-50%) scale(7.4); }
    }
    .splash{
      position:absolute; z-index:27; pointer-events:none;
      width:10px; height:10px; border-radius:999px;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.9), rgba(255, 212, 102,.0) 70%);
      box-shadow: 0 0 18px rgba(255, 200, 90,.22);
      opacity:0; transform: translate(-50%,-50%) scale(.6);
      will-change: transform, opacity;
    }

    /* ВОЗВРАТ К СТАРОМУ ДИЗАЙНУ ОКОН И КНОПОК */
    .overlay{
      position:absolute; inset:0;
      background: rgba(0,0,0,.46);
      z-index:80;
      display:none;
      align-items:center; justify-content:center;
      padding:18px;
    }
    .overlay.on{ display:flex; }
    .modal{
      width:min(640px, 100%);
      border-radius: 22px;
      background: rgba(18,22,34,.74);
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(16px);
      box-shadow: 0 30px 90px rgba(0,0,0,.55);
      overflow:hidden;
      position:relative;
    }
    .modalTop{
      padding:16px 20px;
      display:flex; align-items:center; justify-content:space-between;
      border-bottom:1px solid rgba(255,255,255,.10);
    }
    .modalTop strong{ font-size:16px; letter-spacing:.5px; text-transform: uppercase; color: var(--muted); }
    .xBtn{
      width:34px; height:34px; border-radius:999px;
      display:grid; place-items:center;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.9);
      cursor:pointer;
      line-height:1;
      font-size:18px;
    }
    .xBtn:hover{ background: rgba(255,255,255,.15); }
    .modalBody{ padding:20px 24px 20px 24px; }
    
    .q{ font-size:23px; line-height:1.45; margin:0 0 18px; font-weight: normal; }
    
    .dynamic-inputs { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .radio-label, .check-label {
      display: flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,0.06); padding: 14px 16px;
      border-radius: 14px; border: 1px solid rgba(255,255,255,0.12);
      cursor: pointer; font-size: 20px; transition: all 0.2s;
    }
    .radio-label:hover, .check-label:hover { background: rgba(255,255,255,0.12); }
    .radio-label input, .check-label input { transform: scale(1.4); cursor: pointer; margin: 0; }
    
    .select-row { 
      display: flex; justify-content: space-between; align-items: center; 
      background: rgba(255,255,255,0.06); padding: 12px 16px; 
      border-radius: 14px; font-size: 20px; border: 1px solid rgba(255,255,255,0.12);
    }
    .select-row select { 
      padding: 8px 12px; border-radius: 8px; 
      background: rgba(18,22,34,.90); color: #fff; 
      border: 1px solid rgba(255,255,255,0.3); 
      font-size: 18px; outline: none; font-family: inherit; cursor: pointer;
    }

    button.primary{
      appearance:none; border:0; cursor:pointer;
      color:#fff;
      padding:14px 24px;
      border-radius:14px;
      background: linear-gradient(135deg, rgba(255, 212, 102,.30), rgba(235, 91, 235,.14));
      border:1px solid rgba(255, 212, 102,.30);
      transition: transform 140ms var(--ease);
      touch-action: manipulation;
      font-size: 18px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      width: 100%;
    }
    button.primary:active{ transform: translateY(2px) scale(.98); }
    .feedback{ margin-top:12px; font-size:16px; font-weight:bold; color: var(--muted); min-height:20px; text-align: center; }
    .feedback.good{ color: var(--good); }
    .feedback.bad{ color: var(--bad); }

    /* СТАРАЯ АККУРАТНАЯ ОДОБРЯШКА */
    .toast{
      position:absolute;
      left:50%;
      top: calc(var(--hud-h) + 10px);
      transform: translateX(-50%);
      z-index:200;
      padding:10px 18px;
      border-radius: 999px;
      background: rgba(18,22,34,.72);
      border:1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(14px);
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
      color: rgba(255,255,255,.92);
      font-size:15px;
      font-weight: bold;
      opacity:0;
      pointer-events:none;
    }

    .flyIcon{
      position:absolute;
      width:40px; height:40px;
      transform: translate(-50%,-50%);
      pointer-events:none;
      z-index:120;
      filter: drop-shadow(0 0 10px rgba(255, 212, 102, .35));
    }

    .startScreen, .screen{
      position:absolute; inset:0;
      z-index:110;
      display:flex;
      align-items:center; justify-content:center;
      padding:18px;
      background: radial-gradient(1000px 520px at 50% 45%, rgba(0,0,0,.18), rgba(0,0,0,.68));
    }
    .screen { z-index:95; display:none; }
    .screen.on{ display:flex; }
    .startCard, .card{
      width:min(560px, 100%);
      border-radius: 22px;
      background: rgba(18,22,34,.78);
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(16px);
      box-shadow: 0 30px 90px rgba(0,0,0,.55);
      overflow:hidden;
      text-align:center;
    }
    
    .startCard .body, .card .body{ padding:32px 24px; }
    .startCard h1{ margin:0 0 12px; font-size:34px; letter-spacing:.5px; color: #fff; }
    
    /* АНИМАЦИЯ ПОБЕДНОГО МАЛЬЧИКА/КАРТИНКИ */
    .win-image-wrap {
      margin: 0 auto 24px;
      width: 140px;
      height: 140px;
    }
    .win-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      animation: rock-n-shine 3s infinite ease-in-out;
    }
    @keyframes rock-n-shine {
      0% { transform: rotate(-8deg) scale(1); filter: drop-shadow(0 0 10px rgba(241, 196, 15, 0.4)); }
      50% { transform: rotate(8deg) scale(1.08); filter: drop-shadow(0 0 30px rgba(241, 196, 15, 1)); }
      100% { transform: rotate(-8deg) scale(1); filter: drop-shadow(0 0 10px rgba(241, 196, 15, 0.4)); }
    }

    .card h2{ margin:0 0 20px; font-size:30px; letter-spacing:.5px; }

    .rules-text {
      font-size: 19px;
      color: var(--muted);
      margin: 0 0 28px;
      line-height: 1.4;
    }

    @media (max-width: 980px){
      :root{
        --hero-w: 300px;
        --wand-w: 265px;
        --pit-w: 1040px;
        --pit-h: 640px;
        --wand-x: calc(var(--hero-x) + 12px);
        --wand-y: calc(var(--hero-y) - 8px);
      }
      .slot{ width:26px; height:26px; border-radius:8px; }
      .q { font-size: 20px; }
    }
    @media (max-width: 520px){
      :root{
        --hud-h: auto;
        --hero-w: 250px;
        --wand-w: 220px;
        --wand-x: calc(var(--hero-x) + 10px);
        --wand-y: calc(var(--hero-y) - 5px);
      }
      .hud{ padding:10px 12px; flex-wrap: wrap; justify-content: center; }
      .collection { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="hud">
      <div class="rightHud">
        <div class="score">
          <div class="label">Счёт</div>
          <strong id="scoreValue">0</strong>
        </div>
        <div class="collection">
          <div class="title">Улов</div>
          <div class="slots" id="slots"></div>
        </div>
        <div class="pill">
          <div>
            <div class="label">Ошибки</div>
            <div class="hearts" id="hearts"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="scene" id="scene">
      <div class="bg"></div>
      <div class="pitWrap"><div class="pit"></div></div>
      <svg id="lineLayer"></svg>

      <div class="hero" id="hero">
        <img src="images/hero.png" />
      </div>

      <div class="wand" id="wand" role="button" tabindex="0">
        <img src="images/wand.png" />
      </div>

      <div class="toast" id="toast"></div>

      <div class="startScreen" id="startScreen">
        <div class="startCard">
          <div class="body">
            <h1>Русский язык. 4 класс</h1>
            <p class="rules-text">Кликай на удочку, чтобы поймать много рыбы</p>
            <button class="primary" id="startBtn">НАЧАТЬ</button>
          </div>
        </div>
      </div>

      <div class="overlay" id="overlay">
        <div class="modal" role="dialog">
          <div class="modalTop">
            <strong>Задание</strong>
            <button class="xBtn" id="closeModal">×</button>
          </div>
          <div class="modalBody">
            <p class="q" id="questionText"></p>
            <div id="answerWrap" class="dynamic-inputs"></div>
            <button class="primary" id="submitAnswer">ОТВЕТИТЬ</button>
            <div class="feedback" id="feedback"></div>
          </div>
        </div>
      </div>

      <div class="screen" id="gameover">
        <div class="card">
          <div class="body">
            <h2>Игра закончена</h2>
            <button class="primary" id="restartBtn">НАЧАТЬ ЗАНОВО</button>
          </div>
        </div>
      </div>

      <div class="screen" id="win">
        <div class="card">
          <div class="body">
            <div class="win-image-wrap">
              <img src="images/win.png" class="win-image" alt="Победа!" />
            </div>
            <h2>Молодец!</h2>
            <button class="primary" id="playAgainBtn">ИГРАТЬ ЕЩЁ РАЗ?</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const ASSETS = { items: ["images/item1.png", "images/item2.png", "images/item3.png", "images/item4.png", "images/item5.png"] };

    const ESCAPES = ["Бульк!", "Сорвалась!", "Улизнула!", "Эх, ушла!", "Мимо!"];

    const TASK_SETS = [
      [
        { type: "radio", prompt: "В каком слове все согласные звуки МЯГКИЕ:", options: ["малина", "порог", "небо", "пень"], answer: "пень" },
        { type: "radio", prompt: "В каком слове нет окончания?", options: ["садик", "переходный", "весело"], answer: "весело" },
        { type: "radio", prompt: "В каком ряду в обоих словах в корне пропущена безударная проверяемая гласная?", options: ["в..сна, л..тающий", "м..тель, пр..ход", "с..гласный, вл..теть"], answer: "в..сна, л..тающий" },
        { type: "radio", prompt: "В каком слове нет непроизносимой согласной в корне?", options: ["лес..ной", "чу..ство", "грус..ный"], answer: "лес..ной" },
        { type: "radio", prompt: "В каком слове на конце не пишется Ь?", options: ["плащ..", "помощ..", "молодеж.."], answer: "плащ.." },
        { type: "radio", prompt: "В каком ряду все слова пишутся с разделительным мягким знаком (Ь)?", options: ["руч…и, обез…яна", "под…езд, об…ём", "об…явление, доч…ка", "пон…чик, суч…я"], answer: "руч…и, обез…яна" },
        { type: "radio", prompt: "В каком словосочетании нет предлога?", options: ["вышел (на)балкон", "(за)писал текст", "ушел (из)дома"], answer: "(за)писал текст" },
        { type: "radio", prompt: "В каком словосочетании есть существительное 3-го склонения?", options: ["играет на рояле", "скрылось за тучей", "работа в тетради"], answer: "работа в тетради" },
        { type: "radio", prompt: "В каком словосочетании есть прилагательное в винительном падеже?", options: ["не хватает красного цвета", "думаю о хорошем дне", "купил черный компьютер"], answer: "купил черный компьютер" },
        { type: "multi-select", prompt: "Определи род прилагательных:", items: [{ word: "старое", options: ["м.р.", "ж.р.", "ср.р."], answer: "ср.р." }, { word: "ветхий", options: ["м.р.", "ж.р.", "ср.р."], answer: "м.р." }, { word: "старинная", options: ["м.р.", "ж.р.", "ср.р."], answer: "ж.р." }] },
        { type: "radio", prompt: "Какое слово не является местоимением?", options: ["мне", "под", "тебе"], answer: "под" },
        { type: "radio", prompt: "В каком слове НЕ со словом пишется раздельно?", options: ["(не)забудка", "(не)любить", "(не)рвы"], answer: "(не)любить" },
        { type: "radio", prompt: "Какой глагол относится к 1 спряжению?", options: ["подводить", "проспать", "завести"], answer: "завести" },
        { type: "radio", prompt: "В каком ряду в обоих словах пишется Ь?", options: ["погнат..ся, скажеш..", "старает..ся, улыбает..ся", "шепчеш.., катает..ся"], answer: "погнат..ся, скажеш.." },
        { type: "checkbox", prompt: "Укажи словосочетания:", options: ["открытка от брата", "для праздника", "идёт дождь", "ездить на машине", "перед каникулами"], answer: ["открытка от брата", "ездить на машине"] },

    const TOTAL_QUESTIONS = 18;
    const scene = document.getElementById("scene");
    const overlay = document.getElementById("overlay");
    const closeModal = document.getElementById("closeModal");

    const startBtn = document.getElementById("startBtn");

    const wandEl = document.getElementById("wand");

    const maxMistakes = 3;
    let mistakes = 0, answeredCorrect = 0, score = 0, started = false;

    const State = { IDLE: "idle", CATCHING: "catching", MODAL: "modal", DROPPING: "dropping", FLYING: "flying", SPECIAL: "special", END: "end" };
    let state = State.IDLE, currentTask = null, capturedEl = null, capturedObj = null;

    const DEEP_COUNT = 15, deepItems = [];
    let bonusLeft = 3, praiseLeft = 2, opToken = 0, taskBag = [], cooldown = [], catchCounter = 0;
    
    // БЛОКИРОВКА ПОВТОРОВ ЗАДАНИЙ ПРИ РЕСТАРТЕ
    let currentSetIndex = -1;

    function clamp(n,a,b){ return Math.max(a, Math.min(b, n)); }
    function nextOp(){ opToken++; return opToken; }
    function isOp(t){ return t === opToken; }
    function lockTo(newState){ state = newState; }

    // ФУНКЦИЯ ДЛЯ ПЕРЕМЕШИВАНИЯ МАССИВОВ
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function setHearts(){
      heartsWrap.innerHTML = "";
      for(let i=0;i<maxMistakes;i++){
        const d = document.createElement("div");

        heartsWrap.appendChild(d);
      }
    }

    function setSlots(){
      slotsWrap.innerHTML = "";
      for(let i=0;i<TOTAL_QUESTIONS;i++){
        const s = document.createElement("div");
        s.className = "slot" + (i < answeredCorrect ? " filled" : "");
        if(i < answeredCorrect){
          const img = document.createElement("img");
          img.src = ASSETS.items[i % 5];
          s.appendChild(img);
        }
        slotsWrap.appendChild(s);
      }
    }

    function setScore(){ scoreValue.textContent = String(score); }

    function clearLine(){ if (cancelLineAnim){ cancelLineAnim(); cancelLineAnim = null; } lineLayer.innerHTML = ""; }
    function clearCaptured(){ capturedEl = null; capturedObj = null; currentTask = null; clearLine(); }

    function openModal(task){
      overlay.classList.add("on");
      feedback.textContent = "";
      questionText.innerHTML = task.prompt;
      answerWrap.innerHTML = "";

      // Умная проверка: если все варианты состоят только из цифр, мы их НЕ перемешиваем
      const isOnlyNumbers = task.options ? task.options.every(opt => /^\d+$/.test(opt.trim())) : false;

      if (task.type === "radio") {
        let optionsToShow = [...task.options];
        if (!isOnlyNumbers) shuffleArray(optionsToShow);
        
        optionsToShow.forEach((opt) => {
          const lbl = document.createElement("label");
          lbl.className = "radio-label";
          const origIdx = task.options.indexOf(opt);
          lbl.innerHTML = `<input type="radio" name="taskRadio" value="${origIdx}"> <span>${opt}</span>`;
          answerWrap.appendChild(lbl);
        });
      } else if (task.type === "checkbox") {
        let optionsToShow = [...task.options];
        if (!isOnlyNumbers) shuffleArray(optionsToShow);

        optionsToShow.forEach((opt) => {
          const lbl = document.createElement("label");
          lbl.className = "check-label";
          const origIdx = task.options.indexOf(opt);
          lbl.innerHTML = `<input type="checkbox" name="taskCheck" value="${origIdx}"> <span>${opt}</span>`;
          answerWrap.appendChild(lbl);
        });
      } else if (task.type === "multi-select") {
        task.items.forEach((item, idx) => {
          const row = document.createElement("div");
          row.className = "select-row";
          let selHtml = `<select id="sel_${idx}"><option value="">Выбери...</option>`;
          
          let optionsToShow = [...item.options];
          shuffleArray(optionsToShow); 
          
          optionsToShow.forEach(opt => selHtml += `<option value="${opt}">${opt}</option>`);
          selHtml += `</select>`;
          row.innerHTML = `<span>${item.word}</span> ${selHtml}`;
          answerWrap.appendChild(row);
        });
      }
      lockTo(State.MODAL);
    }

    function closeModalNow(){ overlay.classList.remove("on"); }

    function showToast(text){
      toast.textContent = text;
      toast.animate(
        [ { opacity: 0, transform: "translateX(-50%) translateY(-8px)" },
          { opacity: 1, transform: "translateX(-50%) translateY(0px)", offset: 0.18 },
          { opacity: 1, transform: "translateX(-50%) translateY(0px)", offset: 0.78 },
          { opacity: 0, transform: "translateX(-50%) translateY(-10px)" } ],
        { duration: 1800, easing: "cubic-bezier(.2,.8,.2,1)" }
      );
    }

    function getHeroPullPoint(){
      const hr = heroEl.getBoundingClientRect(), sr = scene.getBoundingClientRect();
      return { x: (hr.left - sr.left) + hr.width * 0.58, y: (hr.top - sr.top) + hr.height * 0.64 };
    }
    function getWandTip(){
      const wr = wandEl.getBoundingClientRect(), sr = scene.getBoundingClientRect();
      return { x: (wr.left - sr.left) + wr.width * 0.92, y: (wr.top - sr.top) + wr.height * 0.25 };
    }
    function getPitRect(){
      const pitWrap = document.querySelector(".pitWrap"), r = pitWrap.getBoundingClientRect(), sr = scene.getBoundingClientRect();
      return { left: r.left - sr.left, top: r.top - sr.top, width: r.width, height: r.height };
    }

    function setLineSvgSize(){
      lineLayer.setAttribute("width", scene.clientWidth);
      lineLayer.setAttribute("height", scene.clientHeight);
      lineLayer.setAttribute("viewBox", `0 0 ${scene.clientWidth} ${scene.clientHeight}`);
    }

    function makeCastPath(p1, p2, t = 0){
      const midX = (p1.x + p2.x) / 2, midY = (p1.y + p2.y) / 2, dx = p2.x - p1.x, dy = p2.y - p1.y, dist = Math.hypot(dx, dy);
      const sag = -Math.min(220, Math.max(80, dist * 0.35)), wave = Math.sin(t * 0.018) * Math.min(22, dist * 0.06), nx = dist ? (-dy / dist) : 0;
      const cx = midX + nx * wave, cy = midY + sag;
      return `M ${p1.x} ${p1.y} C ${(p1.x+cx)/2} ${(p1.y+cy)/2}, ${(p2.x+cx)/2} ${(p2.y+cy)/2}, ${p2.x} ${p2.y}`;
    }

    function setCastLine(on){
      lineLayer.innerHTML = ""; if(!on) return; setLineSvgSize();
      const ns = "http://www.w3.org/2000/svg";
      const glow = document.createElementNS(ns, "path"); glow.setAttribute("class", "linePath lineGlow");
      const main = document.createElementNS(ns, "path"); main.setAttribute("class", "linePath lineMain");
      lineLayer.appendChild(glow); lineLayer.appendChild(main);
      let raf = 0; const start = performance.now();
      const tick = (now) => {
        if (!castP1 || !castP2) return;
        const d = makeCastPath(castP1, castP2, now - start);
        glow.setAttribute("d", d); main.setAttribute("d", d);
        raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
      return () => cancelAnimationFrame(raf);
    }

    function addRipple(x,y){
      const r = document.createElement("div"); r.className = "ripple"; r.style.left = x + "px"; r.style.top = y + "px"; scene.appendChild(r);
      requestAnimationFrame(()=> r.classList.add("play")); setTimeout(()=> r.remove(), 980);
    }
    function addSplash(x,y){
      for(let i=0;i<10;i++){
        const d = document.createElement("div"); d.className = "splash"; d.style.left = x + "px"; d.style.top = y + "px"; scene.appendChild(d);
        const ang = (-Math.PI/2) + (Math.random() * Math.PI), dist = 22 + Math.random() * 64;
        d.animate([{ transform: "scale(.6)", opacity: 0 }, { transform: "scale(1.05)", opacity: 1, offset: 0.2 }, { transform: `translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist}px) scale(.2)`, opacity: 0 }], { duration: 600, fill:"forwards" });
        setTimeout(()=> d.remove(), 700);
      }
    }

    // ИСПРАВЛЕНА СИСТЕМА ВЫБОРА ЗАДАНИЙ
    function initTaskBag(){
      let newSet;
      do {
          newSet = Math.floor(Math.random() * TASK_SETS.length);
      } while (newSet === currentSetIndex && TASK_SETS.length > 1);
      
      currentSetIndex = newSet;
      taskBag = TASK_SETS[currentSetIndex].map(t => ({...t}));
      cooldown = []; catchCounter = 0;
    }

    function takeTask(){
      if(taskBag.length === 0) taskBag = TASK_SETS[currentSetIndex].map(t => ({...t}));
      return taskBag.splice(Math.floor(Math.random() * taskBag.length),1)[0];
    }

    function getFocusedWaterRect(){
      const topHud = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hud-h")) || 86;
      const focus = { left: scene.clientWidth * 0.55, top: Math.max(topHud, scene.clientHeight * 0.55), right: scene.clientWidth * 0.98, bottom: scene.clientHeight * 0.98 };
      const pitR = getPitRect();
      const left = Math.max(focus.left, pitR.left), top = Math.max(focus.top, pitR.top), right = Math.min(focus.right, pitR.left+pitR.width), bottom = Math.min(focus.bottom, pitR.top+pitR.height);
      return { left, top, right, bottom };
    }

    function createDeepItems(){
      deepItems.forEach(o => o.el.remove()); deepItems.length = 0;
      const vw = getFocusedWaterRect();
      for(let i=0;i<DEEP_COUNT;i++){
        const el = document.createElement("div"); el.className = "deepItem";
        const img = document.createElement("img"); img.src = ASSETS.items[Math.floor(Math.random()*5)]; el.appendChild(img);
        const x = vw.left + 50 + Math.random() * (vw.right - vw.left - 100), y = vw.top + 50 + Math.random() * (vw.bottom - vw.top - 100);
        el.style.left = x + "px"; el.style.top = y + "px"; scene.appendChild(el);
        deepItems.push({ el, baseX: x, baseY: y, phase: Math.random()*Math.PI*2, speed: 0.35 + Math.random()*0.65, captured: false });
      }
    }

    function floatLoop(t){
      const vw = getFocusedWaterRect();
      for(const o of deepItems){
        if(o.captured) continue;
        const x = clamp(o.baseX + Math.cos(t*0.001*o.speed + o.phase) * 12, vw.left+20, vw.right-20), y = clamp(o.baseY + Math.sin(t*0.001*o.speed + o.phase) * 10, vw.top+20, vw.bottom-20);
        o.el.style.left = x + "px"; o.el.style.top = y + "px";
      }
      requestAnimationFrame(floatLoop);
    }

    async function flyToSlot(fromEl, slotIndex){
      const slotEl = slotsWrap.children[slotIndex]; if (!slotEl) return;
      const sr = scene.getBoundingClientRect(), fr = fromEl.getBoundingClientRect(), tr = slotEl.getBoundingClientRect();
      const fly = document.createElement("div"); fly.className = "flyIcon";
      const img = document.createElement("img"); img.src = fromEl.querySelector("img").src; fly.appendChild(img);
      fly.style.left = (fr.left - sr.left + fr.width/2) + "px"; fly.style.top = (fr.top - sr.top + fr.height/2) + "px"; scene.appendChild(fly);
      const a = fly.animate([{ left: fly.style.left, top: fly.style.top, opacity: 1 }, { left: (tr.left - sr.left + tr.width/2) + "px", top: (tr.top - sr.top + tr.height/2) + "px", opacity: 0 }], { duration: 800, easing: "ease-in" });
      await a.finished; fly.remove();
    }

    function captureItem(obj){
      if(!started || state !== State.IDLE) return;
      lockTo(State.CATCHING); obj.captured = true; capturedObj = obj; capturedEl = obj.el;
      
      // Замена на escape
      obj.payloadKind = Math.random() < 0.2 ? "escape" : "task";
      
      const randomEscape = ESCAPES[Math.floor(Math.random() * ESCAPES.length)];
      obj.payload = obj.payloadKind === "escape" ? { text: randomEscape } : { task: takeTask() };
      
      wandEl.classList.add("wiggle"); setTimeout(()=>wandEl.classList.remove("wiggle"), 450);
      castP1 = getWandTip();
      const sr = scene.getBoundingClientRect(), r = obj.el.getBoundingClientRect();
      castP2 = { x: (r.left - sr.left) + r.width/2, y: (r.top - sr.top) + r.height/2 };
      cancelLineAnim = setCastLine(true);
      const startX = parseFloat(obj.el.style.left), startY = parseFloat(obj.el.style.top), pull = getHeroPullPoint();
      const duration = 1000, t0 = performance.now(), tok = nextOp();
      
      function step(now){
        if(!isOp(tok)) return;
        const tt = clamp((now - t0)/duration, 0, 1);
        obj.el.style.left = (startX + (startX + (pull.x - startX)*0.3 - startX)*tt) + "px";
        obj.el.style.top = (startY + (startY - 120 - startY)*tt) + "px";
        obj.el.style.transform = `translate(-50%,-50%) scale(${1 + 1.5*tt})`;
        const rr = obj.el.getBoundingClientRect(); castP2 = { x: (rr.left - sr.left) + rr.width/2, y: (rr.top - sr.top) + rr.height/2 };
        
        // ИСПРАВЛЕН БАГ С ЗАВИСАНИЕМ УДОЧКИ
        if(tt < 1) {
            requestAnimationFrame(step); 
        } else { 
            clearLine(); 
            if(obj.payloadKind === "escape"){ // Проверка на escape
                showToast(obj.payload.text); 
                setTimeout(()=>collectSpecial(), 600); 
            } else { 
                currentTask = obj.payload.task; openModal(currentTask); 
            } 
        }
      }
      addRipple(startX + (pull.x - startX)*0.3, startY - 100); addSplash(startX + (pull.x - startX)*0.3, startY - 100);
      requestAnimationFrame(step);
    }

    function collectSpecial(){
      capturedEl.animate([{ opacity: 1 }, { opacity: 0, transform: "translate(-50%,-50%) scale(0)" }], { duration: 400, fill: "forwards" }).onfinish = () => { 
          capturedEl.remove(); clearCaptured(); createDeepItems(); lockTo(State.IDLE); 
      };
    }

    submitAnswer.addEventListener("click", async () => {
      if(state !== State.MODAL) return;
      let ok = false;
      if (currentTask.type === "radio") {
         const ch = document.querySelector('input[name="taskRadio"]:checked');
         if(ch && currentTask.options[ch.value] === currentTask.answer) ok = true;
      } else if (currentTask.type === "checkbox") {
         const checks = Array.from(document.querySelectorAll('input[name="taskCheck"]:checked')).map(el => currentTask.options[el.value]);
         if(checks.length === currentTask.answer.length && checks.every(c => currentTask.answer.includes(c))) ok = true;
      } else if (currentTask.type === "multi-select") {
         ok = currentTask.items.every((it, idx) => document.getElementById(`sel_${idx}`).value === it.answer);
      }

      if(ok){
        feedback.textContent = "Верно!"; feedback.className = "feedback good"; 
        setTimeout(async () => { closeModalNow(); lockTo(State.FLYING); await flyToSlot(capturedEl, answeredCorrect); capturedEl.remove(); clearCaptured(); answeredCorrect++; score += 10; setScore(); setSlots(); if(answeredCorrect >= TOTAL_QUESTIONS) win.classList.add("on"); else { lockTo(State.IDLE); createDeepItems(); } }, 600);
      } else {
        const randomEscape = ESCAPES[Math.floor(Math.random() * ESCAPES.length)];
        showToast(randomEscape);

        feedback.textContent = "Ошибка!"; feedback.className = "feedback bad"; mistakes++; setHearts();
        if(mistakes >= maxMistakes) { closeModalNow(); gameover.classList.add("on"); } 
        else setTimeout(()=> { closeModalNow(); capturedEl.remove(); clearCaptured(); createDeepItems(); lockTo(State.IDLE); }, 1000);
      }
    });

    closeModal.onclick = () => { closeModalNow(); capturedEl.remove(); clearCaptured(); createDeepItems(); lockTo(State.IDLE); };
    wandEl.onclick = () => catchRandomItem();
    startBtn.onclick = () => { started = true; startScreen.style.display = "none"; };
    
    // ИСПРАВЛЕН БАГ С РЕСТАРТОМ И ПОВТОРОМ ЗАДАНИЙ В GENIALLY
    function resetGame() {
      mistakes = 0; answeredCorrect = 0; score = 0;
      gameover.classList.remove("on"); win.classList.remove("on"); closeModalNow();
      if (capturedEl && capturedEl.isConnected) capturedEl.remove();
      clearCaptured();
      initTaskBag(); // Выберет 100% новый набор
      setHearts(); setSlots(); setScore();
      lockTo(State.IDLE);
      createDeepItems();
    }
    restartBtn.onclick = playAgainBtn.onclick = resetGame;

    function catchRandomItem(){
      const av = deepItems.filter(o => !o.captured);
      if(av.length) captureItem(av[Math.floor(Math.random()*av.length)]);
    }

    setHearts(); setSlots(); setScore(); initTaskBag(); createDeepItems(); requestAnimationFrame(floatLoop);
  </script>
</body>
</html>
